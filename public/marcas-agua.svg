        <path d="M0 -18 L0 -12 M0 12 L0 18 M-18 0 L-12 0 M12 0 L18 0 M-13 -13 L-9 -9 M9 9 L13 13 M-13 13 L-9 9 M9 -9 L13 -13"/>
      </g>
    </g>
    <!-- Gestión administrativa: maletín y gráfico -->
    <g transform="translate(50 380) rotate(5)">
      <rect x="0" y="20" width="80" height="56" rx="6"/>
      <path d="M28 20 L28 10 L52 10 L52 20 M0 42 L80 42"/>
      <path d="M110 76 L110 50 M130 76 L130 34 M150 76 L150 20 M100 80 L162 80"/>
